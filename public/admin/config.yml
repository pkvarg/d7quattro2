backend:
  name: github
  repo: OWNER/REPO
  branch: main

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [sk, de, en]
  default_locale: sk

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Description, widget: text, i18n: true }
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
      - { name: body, label: Body, widget: markdown, i18n: true }
