    label_singular: House
    folder: src/content/houses
    extension: json
    format: json
    create: true
    identifier_field: number
    slug: "house-{{fields.number}}"
    fields:
      - {
          name: number,
          label: House number,
          widget: number,
          value_type: int,
          min: 1,
        }
      - {
          name: rent,
          label: Base rent per month (EUR),
